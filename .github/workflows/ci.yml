name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: 5432
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create tables
        run: for f in db/migrations/*.sql; do psql -h localhost -U triage -d triage_test -v ON_ERROR_STOP=1 -f "$f"; done
      - run: npm run test:db:pg

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest triage -v

  deploy:
    needs: [test, test-db, web, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys, json, base64; p = sys.argv[1].split('.')[1]; p += '=' * (-len(p) % 4); c = json.loads(base64.urlsafe_b64decode(p)); print({k: c[k] for k in ('sub', 'aud', 'repository')})" "$token"

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read deploy settings
        run: |
          aws ssm get-parameter --name /ai-security-triage/deploy-config \
            --query Parameter.Value --output text > deploy-config.json
          jq -r '.webBuildEnv | to_entries[] | "\(.key)=\(.value)"' \
            deploy-config.json > web/.env.production.local

      - name: Build
        run: |
          npm ci
          npm run build
          npm run build:lambda
          python scripts/build_triage_lambda.py
          cd web && npm ci && npm run build

      - name: Run database migrations
        run: |
          export DB_CLUSTER_ARN=$(jq -r .dbClusterArn deploy-config.json)
          export DB_SECRET_ARN=$(jq -r .dbSecretArn deploy-config.json)
          export DB_NAME=$(jq -r .dbName deploy-config.json)
          node dist/db/migrate-aws.js

      - name: Deploy Lambda functions
        run: |
          for name in api intake triage; do
            function=$(jq -r ".functions.$name" deploy-config.json)
            (cd "build/lambda/$name" && zip -qr "../$name.zip" .)
            aws lambda update-function-code --function-name "$function" \
              --zip-file "fileb://build/lambda/$name.zip" > /dev/null
            aws lambda wait function-updated --function-name "$function"
            echo "Deployed $function"
          done

      - name: Deploy dashboard
        run: |
          bucket=$(jq -r .webBucket deploy-config.json)
          aws s3 sync web/dist "s3://$bucket" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://$bucket/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "$(jq -r .distributionId deploy-config.json)" \
            --paths /index.html > /dev/null
