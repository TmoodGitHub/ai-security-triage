services:
  db:
    image: pgvector/pgvector:pg17
    container_name: triage-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - triage-db-data:/var/lib/postgresql/data

volumes:
  triage-db-data:
